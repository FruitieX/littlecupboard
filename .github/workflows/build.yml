name: Validate and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command npm ci
      - run: nix develop --command npm run typecheck
      - run: nix develop --command npm test
      - run: nix develop --command npm run format:check
      - run: nix develop --command cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: nix develop --command cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
      - run: nix develop --command cargo test --manifest-path backend/Cargo.toml
      - run: nix develop --command npm run build
      - run: nix develop --command npm run test:production
      - run: nix build .#container
      - name: Load and verify image
        run: |
          docker load < result
          nix develop --command npm run test:container
      - name: Publish image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/fruitiex/forkbasket:main ghcr.io/fruitiex/forkbasket:${{ github.sha }}
          docker push ghcr.io/fruitiex/forkbasket:main
          docker push ghcr.io/fruitiex/forkbasket:${{ github.sha }}
