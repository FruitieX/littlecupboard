name: Validate and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    concurrency:
      group: littlecupboard-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command npm ci
      - name: Verify standalone ChatGPT sign-in protocol
        run: |
          nix develop --command npm ci --prefix scripts/siwc-probe --ignore-scripts
          nix develop --command npm test --prefix scripts/siwc-probe
      - run: nix develop --command npm run typecheck
      - name: Verify catalog artwork and backend seed agree
        run: |
          nix develop --command node scripts/build-catalog-artwork.mjs
          nix develop --command node scripts/export-seed.mjs
          git diff --exit-code -- src/lib/catalog-artwork.ts backend/seed.json
          nix develop --command node scripts/render-catalog-artwork.mjs --check
      - run: nix develop --command python3 scripts/hermes-companion.check.py
      - run: nix develop --command npm test
      - run: nix develop --command npm run format:check
      - run: nix develop --command cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: nix develop --command cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
      - run: nix develop --command cargo test --manifest-path backend/Cargo.toml
      - run: nix develop --command npm run build
      - run: nix develop --command npm run test:production
      - run: nix develop --command npm run test:oidc
      - run: nix develop --command node scripts/verify-updates.mjs
      - run: nix build .#container
      - name: Load and verify image
        run: |
          docker load < result
          nix develop --command npm run test:container
      - name: Publish image
        id: publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/fruitiex/littlecupboard:main ghcr.io/fruitiex/littlecupboard:${{ github.sha }}
          docker push ghcr.io/fruitiex/littlecupboard:main
          docker push ghcr.io/fruitiex/littlecupboard:${{ github.sha }}
          littlecupboard_reference="$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/fruitiex/littlecupboard:${{ github.sha }})"
          [[ "$littlecupboard_reference" == ghcr.io/fruitiex/littlecupboard@sha256:* ]]
          littlecupboard_digest="${littlecupboard_reference##*@}"
          [[ "$littlecupboard_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$littlecupboard_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMELAB_DISPATCH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
    steps:
      - name: Check deployment configuration and source revision
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$HOMELAB_DISPATCH_TOKEN" ]]; then
            echo '::warning::Auto deployment is disabled until HOMELAB_DISPATCH_TOKEN is added to this repository.'
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          littlecupboard_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$littlecupboard_head" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping deployment of this older build.'
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"

      - name: Deploy tested image to homelab
        if: steps.deployment.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {
              "image": "ghcr.io/fruitiex/littlecupboard",
              "digest": "${{ needs.build.outputs.digest }}",
              "revision": "${{ github.sha }}"
            }
